# SME Check - question set
# Each question maps to one or more NIST CSF 2.0 Subcategories.
# Real scoring uses these mappings to compute the personalised gap list
# against combined_priority.csv from the csf_sme_coverage pipeline.
#
# Adding a question:
#   1. Pick a stable snake_case id (never change once shipped)
#   2. Phrase the question in plain English (avoid CSF jargon)
#   3. Map to CSF Subcategories - use the exact IDs from CSF 2.0 Core
#   4. Optional: add `sectors: [healthcare, ...]` to show the question first
#      for those sectors. Omit it for universal questions. Tags must be keys
#      from ordering.SECTOR_KEYS: professional_services, retail,
#      manufacturing, healthcare, ict, hospitality, construction, education.
#      This only changes question order; every question is always shown.
#
# The initial set covers the top-10 combined_priority items from the
# dissertation research. Extend to ~40 questions for full coverage.

version: "0.1"
last_updated: "2026-08-11"

items:
  - id: mfa_email
    text: "We require multi-factor authentication (MFA) on email accounts."
    csf_subcategory: "PR.AA-05"

  - id: mfa_admin
    text: "We require MFA for administrator / privileged accounts."
    csf_subcategory: "PR.AA-05"

  - id: least_privilege
    text: "Staff have only the access rights they need for their role (no shared admin accounts)."
    csf_subcategory: "PR.AA-05"

  - id: mfa_cloud_services
    text: "MFA is enabled on all business cloud services (Microsoft 365, Google Workspace, Xero, and so on)."
    csf_subcategory: "PR.AA-05"

  - id: standard_user_accounts
    text: "Day-to-day work uses standard user accounts, not administrator accounts."
    csf_subcategory: "PR.AA-05"

  - id: network_segmentation
    text: "Guest Wi-Fi and business Wi-Fi are on separate networks."
    csf_subcategory: "PR.IR-01"

  - id: vpn_remote
    text: "Remote workers connect via VPN or a zero-trust access solution."
    csf_subcategory: "PR.IR-01"

  - id: firewall_managed
    text: "We have a managed firewall (not just the ISP-provided router)."
    csf_subcategory: "PR.IR-01"

  - id: admin_interfaces_restricted
    text: "Router and firewall admin interfaces are reachable only from your internal network, not from the internet."
    csf_subcategory: "PR.IR-01"

  - id: wifi_password_strong
    text: "Business Wi-Fi uses WPA2 or WPA3 with a strong password of at least 12 characters (not the ISP default)."
    csf_subcategory: "PR.IR-01"

  - id: patching_os
    text: "Operating systems and browsers are patched within 30 days of a security update."
    csf_subcategory: "PR.PS-01"

  - id: patching_apps
    text: "Business applications (Office, accounting software, etc.) are patched regularly."
    csf_subcategory: "PR.PS-01"

  - id: patching_firmware
    text: "Router, firewall and network device firmware is updated at least every six months."
    csf_subcategory: "PR.PS-01"

  - id: endpoint_av
    text: "Every laptop and desktop runs endpoint protection (antivirus / EDR)."
    csf_subcategory: "DE.CM-09"

  - id: edr_managed
    text: "Endpoint protection is managed centrally by your IT team or an MSP, not each user separately."
    csf_subcategory: "DE.CM-09"

  - id: mobile_device_managed
    text: "Company laptops and phones are enrolled in mobile device management (Intune, Jamf, or similar)."
    csf_subcategory: "DE.CM-09"

  - id: backups_offline
    text: "We have offline or air-gapped backups (not just cloud sync)."
    csf_subcategory: "PR.DS-11"

  - id: backups_tested
    text: "We have tested restoring from backup in the last 12 months."
    csf_subcategory: "PR.DS-11"

  - id: backups_encrypted
    text: "Backups are encrypted so that a stolen backup drive does not expose your data."
    csf_subcategory: "PR.DS-11"

  - id: backups_multi_generation
    text: "You keep multiple older backups (not just yesterday's), so you can recover from before a ransomware infection."
    csf_subcategory: "PR.DS-11"

  - id: security_policy
    text: "We have a written cybersecurity policy shared with all staff."
    csf_subcategory: "GV.PO-01"

  - id: incident_plan
    text: "We have a written Incident Response Plan (who to call, what to do)."
    csf_subcategory: "RS.MA-01"

  - id: staff_training
    text: "All staff have completed cybersecurity awareness training in the last 12 months."
    csf_subcategory: "PR.AT-01"

  - id: phishing_simulation
    text: "We run periodic phishing simulations to test staff awareness."
    csf_subcategory: "PR.AT-01"

  - id: asset_inventory
    text: "We keep an up-to-date inventory of laptops, servers and business software."
    csf_subcategory: "ID.AM-01"

  - id: asset_owner_tracked
    text: "Each critical system has a named owner responsible for it."
    csf_subcategory: "ID.AM-01"

  - id: shadow_it_identified
    text: "You know which cloud services staff actually use (file sharing, note taking, SaaS apps)."
    csf_subcategory: "ID.AM-01"

  - id: password_manager
    text: "Staff use a password manager rather than reusing / writing down passwords."
    csf_subcategory: "PR.AA-01"

  - id: password_length_min
    text: "Staff passwords are at least 12 characters long, or your password tool enforces this."
    csf_subcategory: "PR.AA-01"

  - id: former_staff_disabled
    text: "Accounts for staff who have left the organisation are disabled within one working day."
    csf_subcategory: "PR.AA-01"

  - id: supplier_review
    text: "We review the cybersecurity posture of key IT suppliers annually."
    csf_subcategory: "GV.SC-04"

  - id: data_encryption
    text: "Sensitive data on laptops and USB drives is encrypted."
    csf_subcategory: "PR.DS-01"

  - id: usb_policy
    text: "Removable media (USB drives, external hard drives) are either encrypted or their use is restricted by policy."
    csf_subcategory: "PR.DS-01"

  - id: log_monitoring
    text: "Someone reviews security logs / alerts weekly (in-house or via an MSP)."
    csf_subcategory: "DE.CM-01"

  - id: alerts_configured
    text: "Security alerts (failed logins, unusual sign-ins) are sent to a human by email or SMS, not just logged to a dashboard nobody checks."
    csf_subcategory: "DE.CM-01"

  - id: logs_retained_90_days
    text: "Security logs are retained for at least 90 days (Microsoft 365 and Google Workspace defaults are often only 30)."
    csf_subcategory: "DE.CM-01"
